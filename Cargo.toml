[package]
name        = "recoil"
version     = "0.1.0"
edition     = "2021"
authors     = ["Ali Zain <alizain.arch@gmail.com>"]
description = "Immutable Root Filesystem Mirror, Atomic Rollback Engine, Hybrid Kernel Interception and Cryptographic Provenance Tracking for Linux and Redox OS"
license     = "GPL-3.0"
repository  = "https://github.com/Zainium-Dynamics/Recoil"
keywords    = ["linux", "safety", "recovery", "security", "filesystem"]
categories  = ["command-line-utilities", "os"]

[[bin]]
name = "recoil"
path = "src/main.rs"


# CLI
clap      = { version = "=4.3.24", features = ["derive", "env", "color", "wrap_help"] }
console   = "=0.15.8"
indicatif = "=0.17.8"
rpassword = "=7.2.0"

# Async runtime
tokio = { version = "=1.35.1", features = ["rt-multi-thread", "macros"] }

# Cryptography — pure Rust, no C dependencies
# Key derivation: PBKDF2-HMAC-SHA512 at 600,000 iterations (OWASP 2024).
# argon2 0.5.x deferred to Milestone 3 — toolchain compatibility pending.
pbkdf2  = { version = "=0.12.2", default-features = false }
sha2    = { version = "=0.10.8", default-features = false, features = ["std"] }
hmac    = { version = "=0.12.1", default-features = false }
aes-gcm = { version = "=0.10.3", features = ["std"] }
rand    = { version = "=0.8.5",  features = ["getrandom"] }
zeroize = { version = "=1.7.0",  features = ["derive"] }

# Serialisation — JSON for all internal encrypted structures.
# toml_edit pulls indexmap 2.x which requires edition=2024. JSON is invisible
# to the user since all configuration is AES-256-GCM encrypted on disk.
serde      = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"

# System / Linux kernel interfaces
nix  = { version = "=0.27.1", features = ["fs", "user", "process", "ioctl"] }
libc = "=0.2.153"
dirs = "=5.0.1"

# Filesystem scanning
walkdir = "=2.4.0"

# Time
chrono = { version = "=0.4.34", features = ["serde"] }

# Error handling and logging
thiserror          = "=1.0.57"
tracing            = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter", "fmt", "ansi"] }

[dev-dependencies]
tempfile = "=3.10.1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
